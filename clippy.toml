# disallowed_methods 清单（杠精盲审 2026-10-17）：skeleton-infra/Cargo.toml
# [lints.clippy] disallowed_methods="warn" 只启用 lint 组，缺本文件=清单空=
# 闸完全惰性——「效果只经 FxScope 命名口（tracked/detached）」在此落地。
disallowed-methods = [
  # tokio::spawn 直调：任务脱离 JoinSet 生命周期集/accepting 闸/取消令牌树——
  # 效果只经 skeleton_infra::fx::FxScope 命名口（tracked/detached，tokio feature）。
  "tokio::spawn",
  # #92 之后合法 spawn 只剩 fx 的两处**显式句柄**口，别处同样禁止直呼（bd
  # udf-frame-7qj）：`Handle::spawn` = 脱管、`JoinSet::spawn_on` = 入集。那两处是
  # 命名闸本身，用局部 `#[allow]` 豁免（见 fx.rs `spawn_reserved`/`spawn_detached`），
  # 其余任何直调都会被 -D warnings 拦下。
  "tokio::runtime::Handle::spawn",
  "tokio::task::JoinSet::spawn_on",
]
