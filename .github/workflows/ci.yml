# udf-frame 独立仓 CI（2026-10-23 与主仓 udf-frame.yml 对齐适配：独立仓根即 crate
# 根，无 working-directory/paths 前缀；补 std-ext 测试步对齐正典口径）。
#
# Rust 版本 pin 1.96.0 对齐开发/验证基线，防工具链漂移；三 OS 矩阵。
# 自持 workspace：members = udf-skeleton + udf-std-ext + udf-skeleton-infra。
# 另含 feature 隔离矩阵 job（issue#37）：`full` 全部子开关各跑最小面 check+test。
# 另含 std-ext 三门控域隔离矩阵 job 与 MSRV（1.87, --locked）job。
name: udf-frame CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  udf-frame:
    name: fmt / test / bench / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      # fmt 闸：防风格再漂移+行号钉位断言类测试因格式化重排批量假红
      - name: Rustfmt
        run: cargo fmt --all -- --check

      # 架构回归闸（蓝图 §13 行 1「Sync-only consumer has no Tokio in its
      # dependency tree」/ §11 项 5）：sync-only 依赖图出现 tokio 即红。
      # cargo tree 不编译（毫秒级），故前置在测试步前快速失败。三条图分别覆盖
      # infra 默认面（P12 零 default feature）、显式 sync-only 面、独立消费
      # crate std-ext。三 OS 全跑：图本身与平台无关，成本数秒，但能抓到
      # [target.'cfg(...)'.dependencies] 里偷偷注入的 tokio。
      # fail-closed：cargo tree 失败与检出 tokio 都置 exit 1（无
      # continue-on-error、无 || true）；失败时打印含 tokio 的实际依赖节点供定责。
      # shell: bash 原因：断言需跨 OS 单写法（不引 action/不乱引脚本文件），
      # Windows runner 自带 Git Bash；默认 shell 在 Windows 是 pwsh，同一脚本
      # 无法双跑。
      - name: Sync-only dependency tree (no Tokio)
        shell: bash
        run: |
          fail=0
          assert_no_tokio() {
            local label="$1" tree
            shift
            if ! tree="$(cargo tree "$@" -e normal 2>&1)"; then
              echo "::error::cargo tree failed for: $label"
              printf '%s\n' "$tree"
              fail=1
              return
            fi
            if printf '%s\n' "$tree" | grep -q tokio; then
              echo "::error::$label dependency graph contains tokio:"
              printf '%s\n' "$tree" | grep tokio
              fail=1
            else
              echo "ok: $label dependency graph is tokio-free"
            fi
          }
          assert_no_tokio "udf-skeleton-infra (default features)" -p udf-skeleton-infra
          assert_no_tokio "udf-skeleton-infra --no-default-features --features runtime" -p udf-skeleton-infra --no-default-features --features runtime
          assert_no_tokio "udf-std-ext (default features)" -p udf-std-ext
          exit "$fail"

      # 契约 doctest 门（r2 审计建议-2 单列口径随迁）：skeleton 为纯契约 crate，
      # 行为测试矩阵随实现居 skeleton-infra
      - name: Test skeleton
        run: cargo test -p udf-skeleton

      # std-ext 十四域（批 5-2 拆分后新增步）：默认树行为面。
      # 全量跑（不再 --skip）：paths_alloc 计数锚的并行污染根因已在 fe5728a
      # 根治（计数窗加 IN_WINDOW 线程归属门——只有窗内本线程的分配计入，
      # libtest 主线程/并发测试线程的分配不进窗），并行整跑免疫；此前
      # `--skip anchors --skip verbatim` 是按名字字面量匹配，连带把
      # hash 的 XXH64 官方向量锚、paths 的 Windows verbatim 路径语义测试、
      # scheduler 的 every_anchors_* 等 13 个真实测试一起屏蔽（hollow gate）。
      # paths_alloc 另有独立串行步（下方）作双保险。
      - name: Test std-ext
        run: cargo test -p udf-std-ext

      # std-ext 门控面（hollow gate 闭合）：默认 feature 步跑不到被
      # `#![cfg(feature = ...)]` 门控的测试文件——log-embed 埋点断言
      # （tests/log_embed.rs 整文件门控）35 条在默认面从未执行（实测：
      # 默认面 350 条 / all-features 385 条，差 35 逐条属该文件）。单列
      # all-features 步，使门控面在 CI 真跑。
      - name: Test std-ext (all features)
        run: cargo test -p udf-std-ext --all-features

      # infra 六域 feature 矩阵闸：--workspace 只跑 default=[]（P12 零 feature 面），
      # memgov/journal/log/tokio/testing 全在盲区，单列 all-features 步防漏
      - name: Test skeleton-infra (all features)
        run: cargo test -p udf-skeleton-infra --all-features

      # release 门测试（审计 F1）：release 专用代码（DefaultPathResolver
      # release 臂 home 解析/开发者路径泄漏禁断言）在 debug 步不编译不执行
      # ——单列 release 步防漏（cfg(not(debug_assertions)) 测试在此生效）
      - name: Test skeleton-infra (release gates)
        run: cargo test -p udf-skeleton-infra --release --features log --test log_file

      # LeakGuard 泄漏断言串行闸（infra §3.3/审计 M9）：泄漏 delta 被同二进制并发
      # 分配污染=flaky-by-construction，CI 确定口径=--test-threads=1
      - name: LeakGuard serial (memgov)
        run: cargo test -p udf-skeleton-infra --features memgov --test memgov -- --test-threads=1

      # paths_alloc 事件计数串行闸（终验波 B1）：分配锚逐字背书 doc 声明，
      # 单线程口径最稳（--test-threads=1）。并行污染根因已在 fe5728a 根治
      # （计数窗加 IN_WINDOW 线程归属门，并行整跑免疫），本步保留作双保险：
      # 主步（上方）已全量跑该文件，本步以单线程再跑一次，两条路径均绿才算过。
      # 批 5-2 拆分后该测试文件居 std-ext（原指 skeleton-infra 已无此目标）。
      - name: paths_alloc serial
        run: cargo test -p udf-std-ext --test paths_alloc -- --test-threads=1

      # bench 编译门（infra §3.3/P10 一级）：bench 三组 required-features 为
      # fx/journal/memgov/testing 并集，--no-run 裸跑会整目标跳过（hollow gate），故 all-features
      - name: Bench compile gate
        run: cargo bench -p udf-skeleton-infra --all-features --no-run && cargo bench -p udf-skeleton --no-run

      # clippy 闸（udf-frame-iop）：存量告警已清零（波 2 实测 exit 0），落
      # -D warnings 防回潮。--all-features --all-targets 必带：P12 零 default
      # feature，裸 clippy=空心闸
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # docs 闸：全 workspace 全 feature 构建文档并拒一切 rustdoc 告警（intra-doc
      # 断链 / 私链 / 冗余显式链）——消费方 CI 常带 docs 步，本仓先行自证不红。
      # 存量告警（skeleton 2 / std-ext 9 / infra 13 处）已清零（2026-11-05 批）。
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      # 单切片 clippy 步（udf-frame-iop）：cfg 门挂错 feature 的 unused import
      # 只有单开该 feature 才爆，--all-features 掩盖单 feature 面，双组合各一
      - name: Clippy infra (config-json only)
        run: cargo clippy -p udf-skeleton-infra --no-default-features --features config-json -- -D warnings

      - name: Clippy infra (config-toml only)
        run: cargo clippy -p udf-skeleton-infra --no-default-features --features config-toml -- -D warnings

  # ── feature 隔离矩阵闸（issue#37）────────────────────────────────
  # --all-features 只证组合面：cfg 门挂错 feature、example/测试漏
  # required-features 这类「借别的 feature 才编过」的耦合，单开面才爆
  # （cargo tree 不编译、cargo check 不编 example/test，皆探不到）。
  # 矩阵成员 = Cargo.toml `full` 的全部 14 个子开关，一一对应不挑选；
  # unsafe-evidence 不在 full（证据专用开关，非消费能力）不入矩阵，其
  # 行为由 --all-features 步覆盖。每面最小口径 check+test：
  # --no-default-features --features <X>。
  # 末位 `full` 条目额外验证聚合面：14 叶子并集一次编译+测试（采用方一键
  # 全开的实际口径）。与 --all-features 步的差 = unsafe-evidence 证据开关
  # 不在 full 内（故 full 不是 --all-features 的别名，二者不可互换）。
  # runtime 面显式断言 Tokio-free（蓝图 §13 行 1「Sync-only consumer has
  # no Tokio in its dependency tree」）：与上方 sync-only 步同款
  # cargo tree -e normal + fail-closed 口径（tree 失败与检出 tokio 都
  # exit 1）；该步置于本矩阵使 runtime 面闸门自包含，上方 sync-only 步
  # 的三 OS 版本仍保留（平台维度照旧全覆盖）。
  # 单 OS（ubuntu-latest）：feature 门是 cfg(feature) 维度，与平台正交；
  # 平台维度由上方 3-OS 集成 job 承担（14×3 组合爆炸违背 issue 的
  # "small, intentional" 约束）。
  # 工具链经 dtolnay/rust-toolchain@1.96.0 安装，裸 cargo 即 1.96.0
  # （本机 stable ICE 需 +1.96.0 前缀属本机适配，CI 无此问题）。
  feature-isolation:
    name: feature isolation (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [runtime, pool, memgov, tokio, journal, testing, log-fs, log, tracing, log-embed, compose, view, config-json, config-toml, full]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check (no-default-features --features ${{ matrix.feature }})
        run: cargo check -p udf-skeleton-infra --no-default-features --features ${{ matrix.feature }}

      - name: Test (no-default-features --features ${{ matrix.feature }})
        run: cargo test -p udf-skeleton-infra --no-default-features --features ${{ matrix.feature }}

      - name: Runtime face is Tokio-free (normal dep graph)
        if: matrix.feature == 'runtime'
        shell: bash
        run: |
          if ! tree="$(cargo tree -p udf-skeleton-infra --no-default-features --features runtime -e normal 2>&1)"; then
            echo "::error::cargo tree failed for: runtime face"
            printf '%s\n' "$tree"
            exit 1
          fi
          if printf '%s\n' "$tree" | grep -q tokio; then
            echo "::error::runtime face dependency graph contains tokio:"
            printf '%s\n' "$tree" | grep tokio
            exit 1
          fi
          echo "ok: runtime face normal dep graph is tokio-free"

  # ── std-ext feature 隔离矩阵闸 ──────────────────────────────────
  # std-ext 自身三个门控域（json = serde_json / random = getrandom /
  # log-embed = tracing）都是依赖隔离门：单开面才证「该门不借别的门编过」
  # （--all-features 步正好把三者一起点亮，掩盖单开面）。默认集为空（十三
  # 域常驻零门），故 --no-default-features 与默认等价，仍显式带上：默认集
  # 将来被改成非空时，本步不会静默变成「默认+该门」的另一口径。
  # 单 OS：feature 门是 cfg(feature) 维度，与平台正交。
  std-ext-feature-isolation:
    name: std-ext feature isolation (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [json, random, log-embed]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check (no-default-features --features ${{ matrix.feature }})
        run: cargo check -p udf-std-ext --no-default-features --features ${{ matrix.feature }}

      - name: Test (no-default-features --features ${{ matrix.feature }})
        run: cargo test -p udf-std-ext --no-default-features --features ${{ matrix.feature }}

  # ── MSRV 闸（rust-version = 1.87，三 crate 同值）─────────────────
  # --locked 是本 job 的关键属性：Cargo.lock 参与校验 ⇒ 依赖版本被原地
  # 锁定，任何「依赖抬高 MSRV」都落成**确定性红**（锁文件那版在 1.87 上
  # 编不过，可复现、可定责），而不是解析期惊喜（某天自己挑了个更新的传递
  # 依赖，红在与本仓无关的地方）。锁文件漂移同样红，须显式升级决策。
  # docs -D warnings 与 clippy 刻意不进本 job：两者诊断集随工具链版本
  # 变化，旧工具链会把新 warning 判红 = 与 MSRV 无关的假红。
  # 不装 components：本 job 只需 rustc+cargo 默认面。
  msrv:
    name: msrv (1.87, locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87 (MSRV, no components)
        uses: dtolnay/rust-toolchain@1.87

      - name: Check workspace (locked)
        run: cargo check --workspace --locked

      - name: Test skeleton (locked)
        run: cargo test -p udf-skeleton --locked

      # issue#78 验收「三 crate 的 MSRV 面均被显式覆盖」：上面只覆盖了
      # skeleton 的测试面。std-ext 的**测试面 + 三个可选 feature 组合**
      # 与 infra 的 **all-features 聚合面**在 1.87 上从未验证过（--all-features
      # 步在 1.96 上跑，不能替代 MSRV 面）⇒ 补齐。
      - name: Test std-ext (locked)
        run: cargo test -p udf-std-ext --locked

      - name: Check std-ext optional features (locked)
        run: cargo check -p udf-std-ext --locked --features json,random,log-embed

      - name: Check infra all-features (locked)
        run: cargo check -p udf-skeleton-infra --locked --all-features

  # ── 第二消费方可复现性闸（issue#56 Stage A）──────────────────────────
  # 夹具必须**在 fresh clone 上可独立构建**——它自带空 [workspace] 表（不被
  # 上级 workspace 吸收）、自带 Cargo.lock、path 依赖指向本仓三个 crate。
  # 这条闸就是「clean checkout 证据」本身：只有夹具本体会入库（编译产物由
  # .gitignore 的 validation/**/target/ 覆盖），不依赖维护者本地被忽略的
  # verify/ 残留 ⇒ clone 即复现。
  # 断言两条：① 夹具能构建并通过自身用例（--locked，锁文件漂移即红）；
  # ② sync-only 面的依赖树**无 tokio**（架构回归 §13 行 1 在消费方视角再钉
  # 一次——这是外部 crate 视角，同 crate 豁免规则不生效）。
  # 只跑 ubuntu：夹具与平台无关，三 OS 重复只拉长队列。Stage B 的 async
  # 面 crate 到位后由各自步骤单独加入（其树**应**含 tokio，口径相反）。
  consumer-sim:
    name: consumer-sim (clean checkout, sync-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Build + test sync-only fixture (locked)
        run: |
          cargo build --manifest-path validation/consumer-sim/workflow/Cargo.toml --locked
          cargo test --manifest-path validation/consumer-sim/workflow/Cargo.toml --locked

      - name: Assert fixture dependency tree has no Tokio
        shell: bash
        run: |
          if cargo tree --manifest-path validation/consumer-sim/workflow/Cargo.toml -e normal | grep -q tokio; then
            echo "::error::sync-only fixture dependency tree contains tokio"
            exit 1
          fi
