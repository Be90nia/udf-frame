# udf-frame 独立仓 CI（2026-10-23 与主仓 udf-frame.yml 对齐适配：独立仓根即 crate
# 根，无 working-directory/paths 前缀；补 std-ext 测试步对齐正典口径）。
#
# Rust 版本 pin 1.96.0 对齐开发/验证基线，防工具链漂移；三 OS 矩阵。
# 自持 workspace：members = udf-skeleton + udf-std-ext + udf-skeleton-infra。
name: udf-frame CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  udf-frame:
    name: fmt / test / bench / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      # fmt 闸：防风格再漂移+行号钉位断言类测试因格式化重排批量假红
      - name: Rustfmt
        run: cargo fmt --all -- --check

      # 契约 doctest 门（r2 审计建议-2 单列口径随迁）：skeleton 为纯契约 crate，
      # 行为测试矩阵随实现居 skeleton-infra
      - name: Test skeleton
        run: cargo test -p udf-skeleton

      # std-ext 十四域（批 5-2 拆分后新增步）：默认树行为面。
      # 全量跑（不再 --skip）：paths_alloc 计数锚的并行污染根因已在 fe5728a
      # 根治（计数窗加 IN_WINDOW 线程归属门——只有窗内本线程的分配计入，
      # libtest 主线程/并发测试线程的分配不进窗），并行整跑免疫；此前
      # `--skip anchors --skip verbatim` 是按名字字面量匹配，连带把
      # hash 的 XXH64 官方向量锚、paths 的 Windows verbatim 路径语义测试、
      # scheduler 的 every_anchors_* 等 13 个真实测试一起屏蔽（hollow gate）。
      # paths_alloc 另有独立串行步（下方）作双保险。
      - name: Test std-ext
        run: cargo test -p udf-std-ext

      # std-ext 门控面（hollow gate 闭合）：默认 feature 步跑不到被
      # `#![cfg(feature = ...)]` 门控的测试文件——log-embed 埋点断言
      # （tests/log_embed.rs 整文件门控）35 条在默认面从未执行（实测：
      # 默认面 350 条 / all-features 385 条，差 35 逐条属该文件）。单列
      # all-features 步，使门控面在 CI 真跑。
      - name: Test std-ext (all features)
        run: cargo test -p udf-std-ext --all-features

      # infra 六域 feature 矩阵闸：--workspace 只跑 default=[]（P12 零 feature 面），
      # memgov/journal/log/tokio/testing 全在盲区，单列 all-features 步防漏
      - name: Test skeleton-infra (all features)
        run: cargo test -p udf-skeleton-infra --all-features

      # release 门测试（审计 F1）：release 专用代码（DefaultPathResolver
      # release 臂 home 解析/开发者路径泄漏禁断言）在 debug 步不编译不执行
      # ——单列 release 步防漏（cfg(not(debug_assertions)) 测试在此生效）
      - name: Test skeleton-infra (release gates)
        run: cargo test -p udf-skeleton-infra --release --features log --test log_file

      # LeakGuard 泄漏断言串行闸（infra §3.3/审计 M9）：泄漏 delta 被同二进制并发
      # 分配污染=flaky-by-construction，CI 确定口径=--test-threads=1
      - name: LeakGuard serial (memgov)
        run: cargo test -p udf-skeleton-infra --features memgov --test memgov -- --test-threads=1

      # paths_alloc 事件计数串行闸（终验波 B1）：分配锚逐字背书 doc 声明，
      # 单线程口径最稳（--test-threads=1）。并行污染根因已在 fe5728a 根治
      # （计数窗加 IN_WINDOW 线程归属门，并行整跑免疫），本步保留作双保险：
      # 主步（上方）已全量跑该文件，本步以单线程再跑一次，两条路径均绿才算过。
      # 批 5-2 拆分后该测试文件居 std-ext（原指 skeleton-infra 已无此目标）。
      - name: paths_alloc serial
        run: cargo test -p udf-std-ext --test paths_alloc -- --test-threads=1

      # bench 编译门（infra §3.3/P10 一级）：bench 三组 required-features 为
      # fx/journal/memgov/testing 并集，--no-run 裸跑会整目标跳过（hollow gate），故 all-features
      - name: Bench compile gate
        run: cargo bench -p udf-skeleton-infra --all-features --no-run && cargo bench -p udf-skeleton --no-run

      # clippy 闸（udf-frame-iop）：存量告警已清零（波 2 实测 exit 0），落
      # -D warnings 防回潮。--all-features --all-targets 必带：P12 零 default
      # feature，裸 clippy=空心闸
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # 单切片 clippy 步（udf-frame-iop）：cfg 门挂错 feature 的 unused import
      # 只有单开该 feature 才爆，--all-features 掩盖单 feature 面，双组合各一
      - name: Clippy infra (config-json only)
        run: cargo clippy -p udf-skeleton-infra --no-default-features --features config-json -- -D warnings

      - name: Clippy infra (config-toml only)
        run: cargo clippy -p udf-skeleton-infra --no-default-features --features config-toml -- -D warnings
