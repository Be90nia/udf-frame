# udf-frame 跨平台性能 workflow（2026-10-28 新增）
#
# 与现有 ci.yml 的关系（性能结果不作为 push / PR 合并闸）：
# - ci.yml 是**正确性闸**：fmt / test / bench 编译门 / clippy 三道，红即拦。
#   性能数值是**环境相关量**（共享 runner 抖动、CPU 频率、邻居负载、
#   macOS 定时任务、Windows Defender 扫描……），同一份代码在不同机器上
#   波动 10%~30% 属常态。把它塞进 push/PR 闸 = 用不可靠信号判红绿，
#   结果是开发者学会忽略红灯（告警疲劳），比没有闸更糟。
# - 因此本 workflow 在 workflow_dispatch（手动）与 schedule（每日一次，
#   固定 04:23 UTC）触发；另外仅当 PR 改动本工作流或 bench 定义时触发
#   （路径过滤），用来验证 benchmark 清单/产物映射。所有触发都只产出**数据**
#   （criterion 输出 + bench 摘要 artifact + 基线对比），不参与合并决策。
# - Rust 版本 pin 1.96.0 与 ci.yml 一致（防工具链漂移让性能数不可比）；
#   components 含 clippy/rustfmt 与 ci.yml 同款，便于本地复现同一环境。
# - 矩阵仅 ubuntu-latest + macos-latest：Windows 性能数据本地已有
#   （本仓库开发机为 Windows，性能基线以本地测量为准），CI 侧不重复消耗。
#
# 「性能失败不阻塞」语义（三重保险，任何一处生效即可）：
# 1. 触发面：无 push 触发；PR 仅在 perf workflow / bench 定义变更时路径过滤触发，
#    且不应配置为 required check → 普通代码 PR 不跑，性能数据也不拦合并。
# 2. bench 执行步 `continue-on-error: true` → bench 自身失败（runner 抖动、
#    判据过严）只标红该步，不终止后续 artifact / 摘要产出。
# 3. 基线对比只**告警**（>10% 回归写 warning + step summary），不改退出码。
#    性能基线漂移属常态，把它做成红灯只会制造随机红。
#
# 基线机制（滚动缓存 + artifact 双留存）：
# - 每次跑完从 criterion 的 estimates.json 抽 median/mean → `perf-out/summary.json`。
# - 该文件存进 actions/cache（key 含 run_id，每次一份；restore-keys 按
#   `perf-baseline-<os>-` 前缀取**最近一次**）→ 下次跑时恢复为「上一次基线」，
#   逐 bench 算 % 变化，回归超阈值写入 step summary 告警。
# - 同时上传 artifact（criterion 原始输出 + 摘要），供事后取数/离线对比。
#
# 与 criterion 自带「change:」对比的关系：criterion 的 change 对比是**同工作区
# 内**的（`target/criterion/<id>/base` vs `new`），CI 每次全新 runner → base 为空
# → 永远无对比。故跨轮基线由上面的 summary.json 滚动缓存承担；criterion 的
# change 行在同 job 内仍有效（本次跑两次即见 change 输出），留作本轮自洽参考。

name: udf-frame perf

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/perf.yml"
      - "skeleton-infra/benches/**"
      - "std-ext/benches/**"
  schedule:
    # 每日一次，04:23 UTC——避开整点（CI 调度高峰）。手动触发不受此限。
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # 基线 key 按 OS 分（perf-baseline-<os>-），不同 OS 的基线互不相干 ⇒
    # concurrency 同按 OS 分组：保留 OS 并行，只串行同 OS 的跨 run。
    # cancel-in-progress: false = 排队不取消——取消在途 run 会造出 #51 的
    # 「部分运行污染基线」形态（cache 已存下半套 summary.json、artifact 缺
    # 一半），下一轮拿它当基线 = 假回归告警。
    concurrency:
      group: perf-baseline-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0 (pinned, 与 ci.yml 一致)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      # 依赖下载缓存：只缓存 cargo registry/git（第三方 crate 源码）。
      # **不缓存 target/**：bench 的编译产物每次都重编——
      #   ① target/ 随每个 SHA 生成一份完整副本，几天就把仓库 10GB 缓存配额
      #      撑爆，反而挤掉真正需要的条目；
      #   ② 缓存 target/ 会把上一轮的 criterion 输出（base/ 与 new/）一并
      #      恢复回来，给「本轮产出」的判定引入隐性来源；
      #   ③ bench 结果必须在本机现测——复用旧二进制测不出当前代码的性能。
      # 依赖源码命中后，完整 bench 编译约 2~4 分钟，可接受。
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: perf-${{ matrix.os }}-${{ github.sha }}
          restore-keys: perf-${{ matrix.os }}-

      # 建工作目录：基线目录与产物目录。cache action 本身会在 save 时自建
      # 路径，但**先建好**可保证 restore 落进已有目录、且后续步骤写文件时
      # 目录必在（摘要脚本的写入目标）。
      - name: Prepare workspace directories
        run: mkdir -p perf-baseline perf-out

      # 上一次基线（滚动缓存）：本步在 step 内 restore、job 结束（post）时
      # save 同一个 primary key = perf-baseline-<os>-<run_id>。
      # - primary key 含 run_id ⇒ 每轮一份新条目（本轮不会被判 exact hit 而
      #   跳过保存）；restore-keys 前缀 `perf-baseline-<os>-` ⇒ 命中最近一份
      #   旧基线恢复进 `perf-baseline/`。
      # - 用合并版 actions/cache（而非拆 cache/restore + cache/save 两步）：
      #   前者自动在 post 阶段用同一 primary key 保存，无需在两步之间传
      #   outputs 拼 key（拆开时 save 需另配 key/path，易配错导致静默不存）。
      # - 注：缓存保存失败只是 warning，不会让 job 变红（基线是辅助数据，
      #   不该因为存不进去就阻断本次性能数据产出）。
      - name: Cache bench baseline (rolling)
        uses: actions/cache@v4
        with:
          path: perf-baseline
          key: perf-baseline-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: perf-baseline-${{ matrix.os }}-

      # bench 可编译门：先确认 bench 目标能编过，再花时间真跑。
      # （与 ci.yml 的 bench 编译门同一口径；--all-features 防 required-features
      #  整目标跳过 = hollow gate）
      - name: Bench compile gate
        run: cargo bench --workspace --all-features --no-run

      # bench 目标清点：如实标注哪些 crate 根本没有 bench 目标（下方据此跳过，
      # 不假装跑了）。产物落 perf-out/bench-targets.txt 随 artifact 留存。
      - name: Detect bench targets per crate
        run: |
          mkdir -p perf-out
          cargo metadata --no-deps --format-version 1 > perf-out/metadata.json
          python3 - <<'PY' | tee perf-out/bench-targets.txt
          import json
          md = json.load(open("perf-out/metadata.json"))
          for p in sorted(md["packages"], key=lambda x: x["name"]):
              benches = [t["name"] for t in p["targets"] if "bench" in t["kind"]]
              # 标记用纯 ASCII 单词（无正则元字符），下方 grep 直接匹配。
              mark = ",".join(benches) if benches else "NONE"
              print(f"{p['name']}: {mark}")
          PY

      # 本轮 bench 起点标记（摘要脚本据此只采信此标记之后产出的估计）。
      # 作用：把「本轮数据」的判定锚在一次运行的测量窗口内——若将来有人把
      # target/ 加回缓存，或 bench 中途部分失败留下半套估计，陈旧/半套数据
      # 都不会被当成本轮完整数据写进基线（陈旧数据冒充新数据 = 静默失败）。
      - name: Mark bench start (freshness reference)
        run: |
          mkdir -p perf-out
          touch perf-out/.bench-start

      # 真跑 bench。continue-on-error：性能步失败不终止后续产出
      # （判据/环境抖动 ≠ 代码错；此处的正确性由 ci.yml 负责）。
      # 守卫：目标清单里该 crate 标 NONE（无 bench 目标）→ 如实标注并跳过，
      # 不假装跑了（2026-10-28 起 udf-std-ext 已有 [[bench]] 目标 std_ext；
      # udf-skeleton 仍只有 examples）。匹配不锚行尾：清单由 tee 写出，行尾可能是 CRLF。
      - name: Run bench - udf-skeleton-infra
        continue-on-error: true
        run: |
          if grep -q '^udf-skeleton-infra: NONE' perf-out/bench-targets.txt; then
            echo "udf-skeleton-infra: 无 bench 目标 -> 跳过（如实标注）"
            exit 0
          fi
          cargo bench -p udf-skeleton-infra --all-features

      - name: Run bench - udf-std-ext
        continue-on-error: true
        run: |
          if grep -q '^udf-std-ext: NONE' perf-out/bench-targets.txt; then
            echo "udf-std-ext: 无 bench 目标 -> 跳过（如实标注）"
            exit 0
          fi
          cargo bench -p udf-std-ext --all-features

      # 摘要 + 基线对比：只告警不改退出码（性能漂移常态，不制造随机红）。
      - name: Summarize bench results and compare with previous baseline
        run: |
          mkdir -p perf-out
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, sys

          # CPU 型号入档：基线对比只在同型号 CPU 间告警——不同代际 runner 的
          # 绝对值天然不同（同代码 81ns↔120ns 属常态），互比 = 假回归告警。
          def cpu_model():
              try:
                  if os.path.exists("/proc/cpuinfo"):
                      for line in open("/proc/cpuinfo", encoding="utf-8", errors="replace"):
                          if "model name" in line:
                              return line.split(":", 1)[1].strip()
                  if sys.platform == "darwin":
                      return subprocess.check_output(
                          ["sysctl", "-n", "machdep.cpu.brand_string"], text=True).strip()
              except Exception as exc:
                  print(f"::debug::cpu model detect failed: {exc}")
              return platform.processor() or "unknown"
          cpu = cpu_model()

          root = pathlib.Path("target/criterion")
          # 只采信「本轮产出」的估计：缓存恢复回来的上一轮 new/estimates.json
          # 一律排除（否则陈旧数据冒充本轮数据 = 静默失败）。
          mark = pathlib.Path("perf-out/.bench-start")
          fresh_cutoff = mark.stat().st_mtime if mark.exists() else 0.0

          rows = []
          for est in sorted(root.glob("**/new/estimates.json")):
              if est.stat().st_mtime <= fresh_cutoff:
                  print(f"::debug::skip stale estimate {est}")
                  continue
              bench = str(est.parent.parent.relative_to(root)).replace(os.sep, "/")
              d = json.load(open(est))
              rows.append({
                  "bench": bench,
                  "median": d.get("median", {}).get("point_estimate"),
                  "mean": d.get("mean", {}).get("point_estimate"),
              })

          if not rows:
              print("::warning::未采集到本轮 criterion estimates（bench 未运行 / 被跳过 / 失败）")
              pathlib.Path("perf-out/summary.json").write_text("{}")
              pathlib.Path("perf-out/summary.md").write_text(
                  "# bench 摘要\n\n本轮无数据（bench 未产出新估计）——基线保持不变，下轮继续对比上一份有效基线。\n")
              # 有意不覆写 perf-baseline/summary.json：本轮无数据时保留上一份
              # 有效基线（基线链不断），cache 步骤会把原样存回下一轮。
              # 但目录必须存在——cache 步骤要求 path 存在，否则该步报错。
              if not pathlib.Path("perf-baseline/summary.json").exists():
                  pathlib.Path("perf-baseline").mkdir(parents=True, exist_ok=True)
                  pathlib.Path("perf-baseline/summary.json").write_text("{}")
              sys.exit(0)

          current = {r["bench"]: r["median"] for r in rows if r["median"] is not None}
          pathlib.Path("perf-out/summary.json").write_text(json.dumps(current, indent=2, sort_keys=True))

          # 先读旧基线（本目录由 cache 步骤从上一轮恢复），比较完再覆写为本轮值
          # ——job 结束时 cache 步骤会把本目录存成下一轮的基线。
          baseline = {}
          bp = pathlib.Path("perf-baseline/summary.json")
          if bp.exists():
              baseline = json.loads(bp.read_text())
          base_cpu = baseline.get("_meta", {}).get("cpu")
          same_cpu = (not base_cpu) or (base_cpu == cpu)

          # ── 基线提升完整性闸（#51 / #81）──────────────────────────────
          # **期望 benchmark key 清单**（显式 manifest）：criterion 的 ID 形态有
          # 三种——无 group 的函数（`retry_async_first_attempt`）、带 group 的
          # （`sync_cache/lru_get_hit`）、group+参数（`scheduler/register/1000`）。
          # ⚠️ **不能用 cargo metadata 的 target 名当期望**：metadata 给的是 bench
          # target 名（`std_ext`），而 criterion 的 ID 首段是 **group 名**
          # （`sync_cache`/`scheduler`）——两者无关，用 target 名判会永远判缺。
          # 期望 key 集合 = 显式清单 ∪ 上一份 good 基线的 key 集合（后者覆盖
          # 「清单未同步的旧用例被删」这一情形）。
          EXPECTED_BENCH_IDS = {
              "sync_cache/lru_get_hit",
              "sync_cache/lru_insert_existing_key",
              "sync_cache/ttl_get_hit",
              "sync_cache/ttl_insert_existing_key",
              "retry_async_first_attempt",
              "random_id_v4",
              "random_fill_8x8",
              "scheduler/register_1000",
              "scheduler/register_10000",
              "scheduler/register_100000",
              "scheduler/cancel_1000",
              "scheduler/cancel_10000",
              "scheduler/cancel_100000",
              "scheduler/cancel_reclaim_1000",
              "scheduler/cancel_reclaim_10000",
              "scheduler/cancel_reclaim_100000",
              "scheduler/pending_control_1000",
              "scheduler/pending_control_10000",
              "scheduler/pending_control_100000",
              # ── udf-skeleton-infra/benches/infra.rs 的每组代表 ID ──
              # 只为「该组整组消失/中途死掉」判缺；组内参数化叶子不逐条钉
              # （参数表是 bench 自己的调参面，改了不该红）。动态 ID
              # （effect_batch_forward/k{k}）取固定代表 k1。
              "fxscope_spawn_join",
              "journal_append_line",
              "effect_steady_state",
              "effect_batch_forward/k1",
              "dispatch_per_beat/hit",
              # ⚠️ 2026-11-23（issue#62）：该臂语义已变——历史 Run-ID 诊断默认
              # 关闭 ⇒ 现在测「Cancel 投递的门闸-only 路径」。ID 保留以延续曲线，
              # 但**跨该日期的基线不可直接对比**（闸的判缺能力不受影响）。
              "dispatch_per_beat/cancel_unknown_id",
              "notify_dispatch/no_subscriber",
              "notify_dispatch/one_subscriber",
              "object_pool_acquire_drop/reuse_round_trip",
              "memory_pool_acquire_drop/idle_hit_round_trip",
              "memory_pool_acquire_drop/empty_pool_create_round_trip",
              "thread_pool_reject/abort",
              "thread_pool_reject/caller_runs",
              "byte_budget_contention/unbudgeted_single_thread",
              "byte_budget_contention/budgeted_single_thread",
              "byte_budget_contention/unbudgeted_four_threads",
              "byte_budget_contention/budgeted_four_threads",
              # ── State 布局证据组（issue#53）——每组代表 + 关键反例臂 ──
              # 只钉「组整组消失/中途死掉」；尺寸/参数表属调参面，不逐条钉。
              "state_layout_update/mono_1k_noretain",
              "state_layout_update/sharded_16m_retain",
              "state_layout_update_scope/mono_whole_noretain",
              "state_layout_update_scope/sharded_16parts_all_retain",
              "state_layout_retention/mono_window16",
          }
          base_keys = {k for k in baseline if not k.startswith("_")}
          expected_keys = EXPECTED_BENCH_IDS | base_keys
          missing_keys = sorted(expected_keys - set(current))
          # 期望 group 集合 = 显式清单各 ID 的首段（无 group 的一级 ID 其首段
          # 即自身）⇒ 某 group 整个没出现（如该 bench 二进制中途死了）也判缺。
          expected_groups = {k.split("/")[0] for k in EXPECTED_BENCH_IDS}
          present_groups = {b.split("/")[0] for b in current}
          missing_groups = sorted(expected_groups - present_groups)
          # criterion ID 首段 = group 名（两级/三级 ID 的首段）；一级 ID 的
          # 首段即完整 ID。
          counts = {}
          for b in current:
              head = b.split("/")[0]
              counts[head] = counts.get(head, 0) + 1
          # 与上一份 good 基线比：每个 group 的条目数**不得少于**上次
          # （某组中途失败 → 该组条目变少 → 仍被当完整基线提升 = #51 的形态）。
          # 取舍：维护者**删掉**某个 bench 组时条数也会变少 → 会被判成「疑似部分
          # 运行」而**保守不提升**（需人工确认后删除基线里的对应条目）。这是刻意
          # 取的一边：误判成本 = 基线暂时不更新（可人工修），漏判成本 = 部分运行
          # 永久替换完整基线（不可见）。
          base_counts = baseline.get("_meta", {}).get("counts", {})
          shrunk = sorted((t, n, base_counts[t]) for t, n in counts.items()
                          if t in base_counts and n < base_counts[t])
          complete = (not missing_keys and not missing_groups and not shrunk)
          if not complete:
              if missing_keys:
                  print(f"::warning::本轮缺少 bench key: {missing_keys}")
              if missing_groups:
                  print(f"::warning::本轮缺少 bench group: {missing_groups}")
              for t, n, prev in shrunk:
                  print(f"::warning::bench group {t} 本轮条目 {n} < 上次基线 {prev}（疑似部分运行）")

          lines = ["# bench 摘要（${{ matrix.os }} · CPU: " + cpu + "）", ""]
          lines.append("| bench | median | mean | vs 上次基线 |")
          lines.append("|---|---|---|---|")
          regressions = []
          for r in rows:
              b = r["bench"]
              cur = r["median"]
              base = baseline.get(b)
              if base and cur:
                  delta = (cur - base) / base * 100.0
                  if same_cpu:
                      note = f"{delta:+.1f}%"
                      if delta > 10.0:
                          note += " ⚠️ 回归>10%"
                          regressions.append((b, delta))
                  else:
                      # 跨 CPU 型号：绝对值不可比，只记录不告警（防 runner 换代际假回归）
                      note = f"{delta:+.1f}%（基线 CPU 不同：{base_cpu} → {cpu}，仅记录）"
              else:
                  note = "（无基线）"
              lines.append(f"| {b} | {r['median']} | {r['mean']} | {note} |")
          lines.append("")
          if not same_cpu:
              lines.append(f"> ℹ️ 基线 CPU 型号不同（{base_cpu} → {cpu}）：本轮对比仅记录，不产生回归告警；下轮起以本机为新基线。")
          if regressions:
              lines.append("> ⚠️ 回归超 10%（仅告警，不改退出码）：" +
                           ", ".join(f"{b} {d:+.1f}%" for b, d in regressions))
              for b, d in regressions:
                  print(f"::warning::perf regression {b}: {d:+.1f}% vs 上次基线")
          else:
              lines.append("> 无超阈值回归。")

          pathlib.Path("perf-out/summary.md").write_text("\n".join(lines) + "\n")
          # 本轮值写回基线目录：cache 步骤在 job 结束时把该目录存成下一轮基线
          # （key 含 run_id → 每次一份新缓存；下次 restore-keys 取最近一份）。
          pathlib.Path("perf-baseline").mkdir(parents=True, exist_ok=True)
          if complete:
              payload = {"_meta": {"cpu": cpu, "counts": counts}}
              payload.update(current)
              pathlib.Path("perf-baseline/summary.json").write_text(
                  json.dumps(payload, indent=2, sort_keys=True))
          else:
              # 不完整 ⇒ **不提升基线**：保留上一份 good 基线不覆写（#51：
              # 部分/失败运行不得替换完整滚动基线）。本轮数据仍作为诊断产物
              # 上传（artifact 步骤 if: always()），供事后取数。
              if not pathlib.Path("perf-baseline/summary.json").exists():
                  pathlib.Path("perf-baseline/summary.json").write_text("{}")
              note = ("> ⚠️ 本轮 bench 集合不完整 → **未提升基线**（保留上一份完整基线；"
                      "本轮数据仅作诊断产物）。"
                      + (f"缺少 key: {missing_keys}。" if missing_keys else "")
                      + (f"缺少 group: {missing_groups}。" if missing_groups else "")
                      + ("".join(f" {t} 本轮 {n} < 上次 {p}。" for t, n, p in shrunk)))
              lines.append(note)
              pathlib.Path("perf-out/summary.md").write_text("\n".join(lines) + "\n")
              print("::warning::本轮 bench 集合不完整 → 不提升基线（保留上一份 good 基线）")
          print("\n".join(lines))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "perf-out/summary.md"), "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      # 数据留存：criterion 原始输出 + 摘要 + bench 目标清点。
      - name: Upload criterion output and bench summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}-${{ github.run_number }}
          path: |
            target/criterion
            perf-out
          if-no-files-found: warn
          retention-days: 30
